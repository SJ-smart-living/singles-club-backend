<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Merchant Admin</title><style>.admin{max-width:1100px;margin:30px auto;padding:0 14px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:9px;border-bottom:1px solid var(--line);font-size:12px;text-align:left}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.photos img{width:90px;height:90px;object-fit:cover;border-radius:10px;margin:4px}@media(max-width:650px){.formgrid{grid-template-columns:1fr}}</style></head><body><main class="admin"><h1>Merchant Admin</h1><div id="login" class="panel"><form id="loginForm"><label>Email<input type="email" name="email" required></label><label>Password<input type="password" name="password" required></label><button class="btn primary">Login</button><p id="loginMsg"></p></form></div><div id="workspace" hidden><div class="tabs"><button class="btn ghost" data-tab="dashboard">Dashboard</button><button class="btn ghost" data-tab="events">Events</button><button class="btn ghost" data-tab="posts">Posts</button><button class="btn ghost" data-tab="plans">Plans</button><button class="btn ghost" data-tab="applications">Applications</button><button class="btn ghost" data-tab="settings">Settings</button><button class="btn ghost" id="logout">Logout</button></div><section id="panel" class="panel"></section></div></main><script src="/admin.js"></script></body></html>
