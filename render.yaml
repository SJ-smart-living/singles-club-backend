services:
  - type: web
    name: singles-club-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        value: https://singles-club-backend.onrender.com
      - key: FRONTEND_ORIGIN
        value: https://sj-smart-living.github.io,https://singles-club-backend.onrender.com
